name: Release

# Push a tag like v0.1.0 to build installers for all platforms and publish them
# to a GitHub Release. The installed app auto-updates from these releases.
# The `xb` job then adds the terminal app: single binaries per platform and an npm tarball.
on:
  push:
    tags: ['v*']
  # Manual re-run: pick the tag in "Use workflow from".
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        # bsdtar builds the Arch Linux (.pacman) package.
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: pnpm test
      - name: Signing certificate (macOS)
        if: runner.os == 'macOS'
        # A self-signed certificate gives every release the same signing identity, which the
        # macOS auto-updater requires. Without the secrets the app stays ad-hoc signed.
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$MAC_CERT_P12" ]; then echo "No MAC_CERT_P12 secret; building ad-hoc."; exit 0; fi
          kc="$RUNNER_TEMP/sign.keychain-db"
          security create-keychain -p ci "$kc"
          security set-keychain-settings "$kc"
          security unlock-keychain -p ci "$kc"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$kc" > /dev/null
          id=$(security find-identity -p codesigning "$kc" | awk '/Xari Bulbul Self-Signed/ { print $2; exit }')
          [ -n "$id" ] || { echo "Certificate not found in keychain"; exit 1; }
          echo "XB_SIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          echo "XB_SIGN_IDENTITY=$id" >> "$GITHUB_ENV"
      - name: Build and publish
        working-directory: apps/desktop
        # Owner/repo come from GITHUB_REPOSITORY; this also bakes the auto-update feed into the app.
        run: pnpm exec electron-vite build && pnpm exec electron-builder --publish always -c.publish.provider=github -c.publish.releaseType=release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional Developer ID signing — add these repository secrets when ready:
          # CSC_LINK / CSC_KEY_PASSWORD (macOS .p12 or Windows cert)
          # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID (macOS notarization)
          CSC_IDENTITY_AUTO_DISCOVERY: false

  xb:
    # After the desktop job has created the release, add the terminal app to it.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS binaries are built on macOS so Bun can sign them (Apple silicon refuses unsigned code).
          - os: macos-latest
            targets: bun-darwin-arm64,bun-darwin-x64
          - os: ubuntu-latest
            targets: bun-linux-x64
            npm: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter xari-bulbul-cli test
      - name: Build binaries
        working-directory: apps/cli
        run: node scripts/build.mjs --compile --targets=${{ matrix.targets }}
      - name: Package
        working-directory: apps/cli
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Smoke-test the binary this runner can execute.
          native="xb-$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m | sed 's/x86_64/x64/;s/aarch64/arm64/')"
          "release/$native/xb" --version
          mkdir -p upload
          for dir in release/xb-*; do
            tar -czf "upload/xb-$version-${dir#release/xb-}.tar.gz" -C "$dir" xb
          done
          if [ "${{ matrix.npm }}" = "true" ]; then
            pnpm pack --pack-destination upload
            mv upload/xari-bulbul-cli-*.tgz "upload/xb-$version.tgz"
          fi
          (cd upload && shasum -a 256 * > "SHA256SUMS-xb-${{ runner.os }}.txt")
          ls -la upload
      - name: Upload to the release
        working-directory: apps/cli
        run: gh release upload "$GITHUB_REF_NAME" upload/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
