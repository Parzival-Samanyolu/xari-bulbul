# Qaqaş, the bots app: the same code as Xarı Bülbül built with XARI_EDITION=qaqash.
# Build it with `pnpm dist:qaqash`. Everything not set here comes from electron-builder.yml.
extends: ./electron-builder.yml
appId: dev.xaribulbul.qaqash
# Internal names stay ASCII (packaged Electron crashes on a non-ASCII bundle name); people see "Qaqaş".
productName: Qaqash
artifactName: Qaqash-${version}-${os}-${arch}.${ext}
extraMetadata:
  productName: Qaqash
  desktopName: qaqash.desktop
  description: Qaqaş — bots that chat, answer on WhatsApp and iMessage, and handle your email
mac:
  category: public.app-category.social-networking
  extendInfo:
    CFBundleDisplayName: Qaqaş
    NSMicrophoneUsageDescription: Qaqaş uses the microphone when you dictate a message.
nsis:
  shortcutName: Qaqaş
linux:
  category: Network
  executableName: qaqash
  synopsis: AI bots for chat, messaging and email
  description: Qaqaş runs AI bots that chat with you, answer on WhatsApp and iMessage, and handle your email, with any model.
  desktop:
    entry:
      Name: Qaqaş
      StartupWMClass: Qaqash
