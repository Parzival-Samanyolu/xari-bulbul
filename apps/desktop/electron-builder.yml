appId: dev.xaribulbul.app
# Packaged Electron crashes at launch (SIGTRAP) when the product/bundle name contains
# non-ASCII letters, so internal names stay ASCII and the real name is the display name.
productName: Xari Bulbul
artifactName: XariBulbul-${version}-${os}-${arch}.${ext}
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
  # node-pty: keep the JS and the binaries; drop sources and debug symbols (the Windows .pdb files are ~50 MB).
  - '!**/node_modules/node-pty/{src,deps,third_party,scripts,typings}/**'
  - '!**/node_modules/node-pty/prebuilds/**/*.pdb'
  - '!**/node_modules/node-pty/prebuilds/win32-arm64/**'
afterPack: scripts/after-pack.cjs
afterSign: scripts/self-sign.cjs
asarUnpack:
  - resources/**
  # node-pty's native module and its spawn-helper must be real files on disk.
  - '**/node_modules/node-pty/**'
# node-pty is the only native dependency and is N-API (ABI-stable across Node and Electron): the
# prebuilt binaries it ships (macOS, Windows) or the one built by `pnpm install` (Linux) load as is,
# so packaging needs no compiler.
npmRebuild: false
mac:
  category: public.app-category.developer-tools
  files:
    - '!**/node_modules/node-pty/prebuilds/win32-*/**'
  # The universal app carries node-pty's x64 and arm64 prebuilds side by side (identical in both
  # halves); node-pty picks the one for the running arch.
  x64ArchFiles: '**/node_modules/node-pty/prebuilds/darwin-*/*'
  # Only the display name may be non-ASCII: Electron finds its helper apps via CFBundleName.
  extendInfo:
    CFBundleDisplayName: Xarı Bülbül
    # Shown when voice input first asks for the microphone.
    NSMicrophoneUsageDescription: Xarı Bülbül uses the microphone when you dictate a message.
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  # Ad-hoc signature ("-") until a Developer ID is configured (CSC_LINK / APPLE_ID ...).
  # A complete ad-hoc signature keeps macOS from reporting the app as damaged.
  # Release builds are then re-signed with a self-signed certificate (scripts/self-sign.cjs).
  identity: '-'
  # Hardened runtime is only needed for notarization (Developer ID); with ad-hoc signing it can block launch.
  hardenedRuntime: false
# Releases carry one download per platform. The .zip stays because the macOS updater installs
# from it; blockmaps (for partial update downloads) are left out, so updates download in full.
dmg:
  writeUpdateInfo: false
win:
  icon: build/icon.png
  files:
    - '!**/node_modules/node-pty/prebuilds/darwin-*/**'
  target:
    - target: nsis
      arch: [x64]
nsis:
  differentialPackage: false
  shortcutName: Xarı Bülbül
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Development
  files:
    - '!**/node_modules/node-pty/prebuilds/**'
  # AppImage runs on every distro and updates itself; packaging/arch/PKGBUILD repackages it for Arch.
  target: [AppImage]
  maintainer: Xarı Bülbül contributors
  # Used for the .desktop file and the package name on Linux (must be lowercase ASCII).
  executableName: xari-bulbul
  synopsis: AI coding agent for your desktop
  description: Xarı Bülbül is a desktop AI coding agent that works with OpenRouter, Ollama and any OpenAI-compatible provider.
  desktop:
    entry:
      Name: Xarı Bülbül
      StartupWMClass: Xari Bulbul
# Publishing (GitHub Releases + auto-update feed) is configured by the release workflow,
# where GitHub provides the repository. Local builds (`pnpm dist`) never publish.
