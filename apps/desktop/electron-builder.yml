appId: dev.xaribulbul.app
# Packaged Electron crashes at launch (SIGTRAP) when the product/bundle name contains
# non-ASCII letters, so internal names stay ASCII and the real name is the display name.
productName: Xari Bulbul
artifactName: XariBulbul-${version}-${os}-${arch}.${ext}
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
afterSign: scripts/self-sign.cjs
asarUnpack:
  - resources/**
mac:
  category: public.app-category.developer-tools
  # Only the display name may be non-ASCII: Electron finds its helper apps via CFBundleName.
  extendInfo:
    CFBundleDisplayName: Xarı Bülbül
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  # Ad-hoc signature ("-") until a Developer ID is configured (CSC_LINK / APPLE_ID ...).
  # A complete ad-hoc signature keeps macOS from reporting the app as damaged.
  # Release builds are then re-signed with a self-signed certificate (scripts/self-sign.cjs).
  identity: '-'
  # Hardened runtime is only needed for notarization (Developer ID); with ad-hoc signing it can block launch.
  hardenedRuntime: false
win:
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  shortcutName: Xarı Bülbül
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Development
  # pacman = Arch Linux / Manjaro / EndeavourOS (install with `sudo pacman -U file.pacman`)
  target: [AppImage, deb, pacman]
  maintainer: Xarı Bülbül contributors
  # Used for the .desktop file and the package name on Linux (must be lowercase ASCII).
  executableName: xari-bulbul
  synopsis: AI coding agent for your desktop
  description: Xarı Bülbül is a desktop AI coding agent that works with OpenRouter, Ollama and any OpenAI-compatible provider.
  desktop:
    entry:
      Name: Xarı Bülbül
      StartupWMClass: Xari Bulbul
# Package names may not contain spaces or capitals, so they don't follow productName.
deb:
  packageName: xari-bulbul
pacman:
  packageName: xari-bulbul
  depends: [gtk3, nss, alsa-lib, libxss, libxtst, xdg-utils, at-spi2-core, libsecret]
# Publishing (GitHub Releases + auto-update feed) is configured by the release workflow,
# where GitHub provides the repository. Local builds (`pnpm dist`) never publish.
